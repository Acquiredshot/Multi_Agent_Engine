# Shared building blocks. Anchors keep the four app services from repeating
# the same env, mounts and dependency rules.

# Values fixed by the compose topology. These sit in `environment:`, which
# takes precedence over `env_file:`, so a stray REDIS_HOST in .env cannot
# point a container at the wrong Redis.
x-topology-env: &topology-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
  # Kept in step with the OCR_BACKEND build arg below, both read from the same
  # host variable, so one value selects the image's dependency layer and the
  # strategy the worker loads. Set it in .env: OCR_BACKEND=tesseract.
  OCR_BACKEND: ${OCR_BACKEND:-tesseract}
  # Blanked deliberately: an inline password in .env would otherwise be
  # injected here and become visible in `docker inspect`. The mounted secret
  # above is the only credential source inside a container.
  REDIS_PASSWORD: ""
  RABBITMQ_PASSWORD: ""
  # Base port for the per-worker Prometheus exporters (see app/metrics.py).
  PROMETHEUS_METRICS_PORT: "8001"

x-app: &app
  build:
    context: .
    args:
      OCR_BACKEND: ${OCR_BACKEND:-tesseract}
  env_file:
    # Optional local overrides (LOG_LEVEL, DEBUG, task limits...). Absent by
    # default, and never baked into the image.
    - path: .env
      required: false
  environment: *topology-env
  secrets:
    - redis_password
    - rabbitmq_password
  volumes:
    # Source is mounted so --reload sees host edits; drop for prod.
    - ./app:/srv/app:ro
  depends_on:
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: mae_redis
    # sh -c because redis-server cannot read --requirepass from a file itself.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    ports:
      # Loopback only; the password is the second line of defence, not the first.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    healthcheck:
      # -a so the ping authenticates; otherwise it fails with NOAUTH.
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mae_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # Enables the official Prometheus plugin (metrics on :15692) in addition
      # to the management plugin, without changing the image.
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # Enables per-object (per-queue) Prometheus metrics.
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    container_name: mae_api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker_ocr:
    <<: *app
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=INFO
      --queues=ocr,default
      --concurrency=2
      --hostname=ocr@%h

  worker_compliance:
    <<: *app
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=INFO
      --queues=compliance,default
      --concurrency=2
      --hostname=compliance@%h

  worker_anomaly:
    <<: *app
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=INFO
      --queues=anomaly,default
      --concurrency=2
      --hostname=anomaly@%h

  # ---------------------------------------------------------------------------
  # Monitoring stack
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: mae_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mae_redis_exporter
    environment:
      # The exporter needs the Redis password as a JSON map of address -> password
      # (REDIS_PASSWORD_FILE); it cannot read the raw secret file and has no shell.
      # monitoring/redis/passwords.json is generated from secrets/redis_password
      # (git-ignored) — see README "Monitoring" for the exact command.
      REDIS_ADDR: redis://redis:6379/0
      REDIS_PASSWORD_FILE: /run/redis-passwords.json
    volumes:
      - ./monitoring/redis/passwords.json:/run/redis-passwords.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mae_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mae_grafana
    environment:
      # Credentials come from the environment / .env — never hardcoded.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/multi-agent-engine.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

secrets:
  redis_password:
    file: ./secrets/redis_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password

volumes:
  redis_data:
  prometheus_data:
  grafana_data: